<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwissMicros Factory Defaults</title>
    <link rel="stylesheet" href="https://swissmicros.github.io/swissmicros-factorydefaults/assets/css/style.css?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.9.0/github-markdown-light.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --border:      #d0d7de;
            --divider:     #e5e5e5;
            --panel-bg:    #ffffff;
            --chrome-bg:   #f3f3f3;
            --hover-bg:    #e5f3ff;
            --focus:       #0067c0;
            --text:        #1b1b1b;
            --muted:       #5d5d5d;
            --link:        #0969da;
            --radius:      6px;
            --shadow:      0 1px 3px rgba(27,31,36,0.12), 0 1px 2px rgba(27,31,36,0.08);
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .doc-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            margin-bottom: 2rem;
            color: var(--text);
        }

        /* ── Toolbar: back to folder + address bar + actions ─────── */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.4rem 0.5rem;
            background: var(--chrome-bg);
            border-bottom: 1px solid var(--divider);
        }
        .nav-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            flex-shrink: 0;
            border-radius: 4px;
            color: var(--text);
        }
        .nav-btn:hover { background: rgba(0,0,0,0.06); }
        .nav-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }

        .address-bar {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            height: 30px;
            margin-left: 0.25rem;
            padding: 0 0.5rem;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.8125rem;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }
        .address-bar svg { flex-shrink: 0; }
        #breadcrumb { display: flex; align-items: center; }
        .bc-seg {
            padding: 0.15rem 0.35rem;
            border-radius: 3px;
            color: var(--text);
            text-decoration: none;
        }
        a.bc-seg:hover { background: var(--hover-bg); }
        .bc-sep { color: var(--muted); padding: 0 0.1rem; user-select: none; }

        .tb-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            height: 30px;
            margin-left: 0.25rem;
            padding: 0 0.7rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 500;
            text-decoration: none;
            white-space: nowrap;
            transition: background 0.12s, border-color 0.12s, color 0.12s;
        }
        .tb-btn:hover { background: var(--link); border-color: var(--link); color: #fff; text-decoration: none; }

        /* ── Document ────────────────────────────────────────────── */
        .markdown-body {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 2.5rem 2.5rem;
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .markdown-body code, .markdown-body pre { font-family: 'IBM Plex Mono', monospace; }

        .state {
            padding: 3rem 1rem;
            text-align: center;
            color: var(--muted);
            font-style: italic;
        }
        .state.is-error { color: #cf222e; font-style: normal; }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid var(--border);
            border-top-color: var(--link);
            border-radius: 50%;
            animation: spin 0.65s linear infinite;
            margin-right: 0.5rem;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 580px) {
            .markdown-body { padding: 1.25rem 1rem 1.5rem; }
            .tb-btn .tb-label { display: none; }
        }
    </style>
</head>
<body>

<section class="page-header">
    <h1 class="project-name">SwissMicros Factory Defaults</h1>
    <h2 class="project-tagline">Factory default files for Pioneer &amp; Voyager models</h2>
    <a href="https://swissmicros.com" class="btn">Shop</a>
    <span class="btn-sep">|</span>
    <a href="https://technical.swissmicros.com" class="btn">Documentation</a>
    <span class="btn-sep">|</span>
    <a href="https://forum.swissmicros.com" class="btn">Community Forum</a>
</section>

<section class="main-content">

    <div class="doc-panel">

        <div class="toolbar">
            <a class="nav-btn" id="btn-up" href="./" title="Up to the folder" aria-label="Up to the folder">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13.5v-11M3.5 7 8 2.5 12.5 7"/></svg>
            </a>
            <nav class="address-bar" id="address-bar" aria-label="Current file">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 13.25 16h-9.5A1.75 1.75 0 0 1 2 14.25V1.75z" fill="#57606a" fill-opacity="0.15" stroke="#57606a" stroke-width="1.25"/>
                    <path d="M10 .5v3a.5.5 0 0 0 .5.5h3" stroke="#57606a" stroke-width="1.25" stroke-linecap="round"/>
                </svg>
                <span id="breadcrumb"></span>
            </nav>
            <a class="tb-btn" id="btn-raw" href="#" target="_blank" rel="noopener" title="Show the plain Markdown source">
                <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 4 1.5 8l4 4M10.5 4l4 4-4 4"/></svg>
                <span class="tb-label">Raw</span>
            </a>
            <a class="tb-btn" id="btn-download" href="#" title="Download this file">
                <svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2.75 14A1.75 1.75 0 0 1 1 12.25v-2.5a.75.75 0 0 1 1.5 0v2.5c0 .138.112.25.25.25h10.5a.25.25 0 0 0 .25-.25v-2.5a.75.75 0 0 1 1.5 0v2.5A1.75 1.75 0 0 1 13.25 14Z"/><path d="M7.25 7.689V2a.75.75 0 0 1 1.5 0v5.689l1.97-1.97a.749.749 0 1 1 1.06 1.06l-3.25 3.25a.749.749 0 0 1-1.06 0L4.22 6.779a.749.749 0 1 1 1.06-1.06z"/></svg>
                <span class="tb-label">Download</span>
            </a>
        </div>

        <article class="markdown-body" id="doc">
            <div class="state"><span class="spinner"></span>Loading…</div>
        </article>

    </div>

    <footer class="site-footer">
        <span class="site-footer-owner">
            <a href="https://github.com/swissmicros/swissmicros-factorydefaults">SwissMicros Factory Defaults</a>
            is maintained by <a href="https://github.com/swissmicros">SwissMicros</a>.
        </span>
    </footer>

</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/18.0.14/lib/marked.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.16/purify.min.js"></script>
<script src="assets/js/repo-tree.js"></script>
<script>
/* Renders a Markdown file from the repository: viewer.html?path=<repo path>.
 * The site serves .md files as plain text, so the folder browser links here
 * instead. Links inside the document are rewritten to point back into the
 * repository — other Markdown files open in this viewer, everything else at
 * its path on this site. */
(function () {
    'use strict';

    const REPO_OWNER = 'swissmicros';
    const REPO_NAME  = 'swissmicros-factorydefaults';
    const BRANCH     = 'main';
    const ROOT_LABEL = 'Factory Defaults';
    const TREE_OPTS  = { owner: REPO_OWNER, repo: REPO_NAME, branch: BRANCH };

    const ICON_CHEVRON = `<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3.5 1.5 7 5 3.5 8.5"/>
    </svg>`;

    function h(str) {
        return String(str)
            .replace(/&/g,'&amp;').replace(/</g,'&lt;')
            .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function sitePath(path) {
        return path.split('/').map(encodeURIComponent).join('/');
    }

    function isMarkdown(path) {
        return /\.md$/i.test(path);
    }

    function viewerUrl(path, hash) {
        return 'viewer.html?path=' + encodeURIComponent(path) + (hash || '');
    }

    function folderUrl(dir) {
        return dir ? './#' + dir : './';
    }

    /* GitHub-style heading anchors, so in-page links like #dm42-v326 work. */
    function slug(text) {
        return text.trim().toLowerCase()
            .replace(/[^\p{L}\p{N}\s_-]/gu, '')
            .replace(/\s/g, '-');
    }

    function renderBreadcrumb(path) {
        const parts = path.split('/');
        const sep   = `<span class="bc-sep">${ICON_CHEVRON}</span>`;
        let html = `${sep}<a class="bc-seg" href="./">${h(ROOT_LABEL)}</a>`;
        let cur  = '';
        parts.forEach((part, i) => {
            cur += (cur ? '/' : '') + part;
            html += sep + (i < parts.length - 1
                ? `<a class="bc-seg" href="${h(folderUrl(cur))}">${h(part)}</a>`
                : `<span class="bc-seg">${h(part)}</span>`);
        });
        document.getElementById('breadcrumb').innerHTML = html;
        const bar = document.getElementById('address-bar');
        bar.scrollLeft = bar.scrollWidth;
    }

    function rewriteLinks(doc, path) {
        doc.querySelectorAll('a[href]').forEach(a => {
            const href = a.getAttribute('href');
            const ref  = RepoTree.resolveLink(path, href);
            if (ref) {
                a.href = isMarkdown(ref.path) ? viewerUrl(ref.path, ref.hash)
                                              : sitePath(ref.path) + ref.hash;
            } else if (/^(https?:)?\/\//i.test(href)) {
                a.target = '_blank';
                a.rel = 'noopener';
            }
        });
        doc.querySelectorAll('img[src]').forEach(img => {
            const ref = RepoTree.resolveLink(path, img.getAttribute('src'));
            if (ref) img.src = sitePath(ref.path);
        });
    }

    function addHeadingIds(doc) {
        const seen = {};
        doc.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(el => {
            let id = slug(el.textContent);
            if (seen[id] != null) id += '-' + (++seen[id]);
            else seen[id] = 0;
            el.id = id;
        });
    }

    /* Same-origin first; raw.githubusercontent covers a checkout served
       without the .md files, and both send CORS-readable text. */
    async function fetchMarkdown(path) {
        for (const url of [sitePath(path), RepoTree.rawUrl(TREE_OPTS, path)]) {
            try {
                const res = await fetch(url, { cache: 'no-cache' });
                if (res.ok) return await res.text();
            } catch (e) { /* try the next source */ }
        }
        throw new Error('the file could not be loaded');
    }

    async function show() {
        const doc  = document.getElementById('doc');
        const raw  = new URLSearchParams(location.search).get('path') || '';
        const path = raw.replace(/^\/+|\/+$/g, '');

        if (!path || !isMarkdown(path) || path.split('/').includes('..')) {
            doc.innerHTML = `<div class="state is-error">⚠ No Markdown file was given to show.</div>`;
            return;
        }

        const name = path.split('/').pop();
        const dir  = path.split('/').slice(0, -1).join('/');
        document.title = `${name} — SwissMicros Factory Defaults`;
        renderBreadcrumb(path);
        document.getElementById('btn-up').href = folderUrl(dir);
        document.getElementById('btn-raw').href = sitePath(path);
        const dl = document.getElementById('btn-download');
        dl.href = RepoTree.rawUrl(TREE_OPTS, path);
        dl.setAttribute('download', name);

        try {
            const text = await fetchMarkdown(path);
            doc.innerHTML = DOMPurify.sanitize(marked.parse(text, { gfm: true }));
            addHeadingIds(doc);
            rewriteLinks(doc, path);
            const h1 = doc.querySelector('h1');
            if (h1) document.title = `${h1.textContent} — SwissMicros Factory Defaults`;
            if (location.hash) {
                const target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
                if (target) target.scrollIntoView();
            }
        } catch (err) {
            doc.innerHTML = `<div class="state is-error">⚠ Failed to load ${h(name)}: ${h(err.message)}</div>`;
        }
    }

    show();
})();
</script>

</body>
</html>
